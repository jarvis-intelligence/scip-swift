name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Requirement D-12/D-14 (02-03): the single scip CLI pin. CI downloads this exact
  # release from scip-code/scip (checksum-verified) and gates the suite via SCIP_BIN;
  # ScipSwiftVersion.scipCliVersion must match — the ScipCLIGate suite cross-checks
  # the running binary's version against it. Bumps are explicit.
  SCIP_CLI_VERSION: "0.9.0"
  # Requirement (02-04, gap closure): the pinned Swift toolchain pair. Swift 6.2.4 ships
  # in Xcode 26.3 (per swift.org release metadata), and the committed snapshot goldens
  # are generated under exactly this toolchain — CI must build with it, never the runner
  # default (macos-26 defaults to Xcode 26.6 / Swift 6.3.3). The select-and-verify step
  # below enforces the pair fail-loud (T-02-10/T-02-11); the in-suite ToolchainDriftGuard
  # re-asserts it inside swift test.
  SWIFT_TOOLCHAIN_PIN: "6.2.4"
  XCODE_PIN: "26.3"

jobs:
  build-and-test:
    # Requirement: macOS host — building/indexing Apple-platform code needs Xcode + the iOS SDK,
    # which Apple does not ship for Linux (design.md Risks).
    # macos-26's DEFAULT toolchain (Xcode 26.6 / Swift 6.3.3) is NOT trusted: the image also
    # ships Xcode 26.3 (Swift 6.2.4), and the "Select and verify the pinned Swift toolchain"
    # step below selects it via DEVELOPER_DIR and fails loudly on any drift — Package.swift
    # requires swift-tools-version 6.2 and the goldens require the .swift-version pin.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      # Requirement (02-04, T-02-10/T-02-11): enforce the pinned toolchain — never a silent
      # fallback to the runner default. Three fail-loud ::error:: paths: .swift-version vs
      # SWIFT_TOOLCHAIN_PIN mismatch, pinned Xcode missing from the image, and selected
      # toolchain version mismatch. DEVELOPER_DIR is exported to GITHUB_ENV so every later
      # swift build / swift test step inherits the pinned toolchain.
      - name: Select and verify the pinned Swift toolchain
        run: |
          set -euo pipefail
          PIN_FILE_VERSION="$(tr -d '[:space:]' < .swift-version)"
          if [ "$PIN_FILE_VERSION" != "$SWIFT_TOOLCHAIN_PIN" ]; then
            echo "::error::.swift-version ($PIN_FILE_VERSION) != SWIFT_TOOLCHAIN_PIN ($SWIFT_TOOLCHAIN_PIN) — update the workflow pin pair together with .swift-version, ToolchainInfo.pinnedSwiftVersion, and regenerate the goldens via UPDATE_GOLDENS=1 under the new toolchain (see README Known limitations)"
            exit 1
          fi
          PINNED_DEVELOPER_DIR="/Applications/Xcode_${XCODE_PIN}.app/Contents/Developer"
          if [ ! -d "$PINNED_DEVELOPER_DIR" ]; then
            echo "::error::Pinned Xcode not found at $PINNED_DEVELOPER_DIR — the runner image no longer ships it. Bump the pin pair (SWIFT_TOOLCHAIN_PIN + XCODE_PIN in ci.yml, .swift-version, ToolchainInfo.pinnedSwiftVersion) and regenerate the goldens via UPDATE_GOLDENS=1 under the new toolchain (see README Known limitations)"
            exit 1
          fi
          echo "DEVELOPER_DIR=$PINNED_DEVELOPER_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$PINNED_DEVELOPER_DIR"
          SWIFT_VERSION_OUTPUT="$(swift --version)"
          echo "$SWIFT_VERSION_OUTPUT"
          # The trailing " (" anchor makes 6.2.4 unable to match 6.2.40-style suffixes.
          if ! grep -qF "Apple Swift version ${SWIFT_TOOLCHAIN_PIN} (" <<< "$SWIFT_VERSION_OUTPUT"; then
            echo "::error::Selected toolchain is not Swift $SWIFT_TOOLCHAIN_PIN — got: $SWIFT_VERSION_OUTPUT. A red golden diff on a different toolchain is environment drift, not a regression (see README Known limitations)"
            exit 1
          fi

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          echo "Pinned Swift version (.swift-version): $(cat .swift-version)"

      - name: Detect CPU architecture
        id: arch
        run: echo "arch=$(uname -m | sed -e 's/x86_64/amd64/')" >> "$GITHUB_OUTPUT"

      # Requirement D-12 (02-03): the pinned CLI tarball is cached by version+arch, so an
      # unchanged pin skips the download entirely; the cache restores the already
      # checksum-verified artifact.
      - name: Restore pinned scip CLI cache
        id: scip-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/scip-cli
          key: scip-cli-v${{ env.SCIP_CLI_VERSION }}-${{ steps.arch.outputs.arch }}

      - name: Download and verify the pinned scip CLI
        if: steps.scip-cli-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ARCH="${{ steps.arch.outputs.arch }}"
          BASE="https://github.com/scip-code/scip/releases/download/v${SCIP_CLI_VERSION}"
          mkdir -p "$HOME/scip-cli"
          cd "$HOME/scip-cli"
          curl -fsSL -o "scip-darwin-${ARCH}.tar.gz" "${BASE}/scip-darwin-${ARCH}.tar.gz"
          curl -fsSL -o "scip-darwin-${ARCH}.tar.gz.sha256" "${BASE}/scip-darwin-${ARCH}.tar.gz.sha256"
          # Checksum verification against the release-published .sha256 sidecar —
          # any mismatch fails the job (T-02-07).
          shasum -a 256 -c "scip-darwin-${ARCH}.tar.gz.sha256"
          tar xzf "scip-darwin-${ARCH}.tar.gz"

      - name: Export SCIP_BIN for the gate tests
        run: |
          echo "SCIP_BIN=$HOME/scip-cli/scip" >> "$GITHUB_ENV"
          "$HOME/scip-cli/scip" --version

      - name: Build
        run: swift build --configuration debug

      # Requirement D-13 (02-03): the full gate — golden table, fixture lint, snapshot
      # goldens, version cross-check, determinism — runs on every push/PR.
      - name: Test
        run: swift test --configuration debug
