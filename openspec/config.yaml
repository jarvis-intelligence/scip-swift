schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  scip-swift is a standalone Swift CLI (executable target, SwiftPM) that converts a Swift repo's
  build index into genuine scip.proto output (real protobuf Index/Document/Symbol/Occurrence
  messages, consumable by any standard SCIP tool: the `scip` CLI, `codeintel`, Sourcegraph, editor
  plugins). It reads the IndexStoreDB index (the same index Xcode and SourceKit-LSP use) produced
  by `swift build --enable-index-store` (SwiftPM repos) or `xcodebuild ...
  COMPILER_INDEX_STORE_ENABLE=YES` (Xcode-project repos).

  Tech stack: Swift 6.2 (swift-tools-version 6.2, pinned toolchain in .swift-version), SwiftPM.
  Key dependencies: swiftlang/indexstore-db (reads the build index), apple/swift-protobuf (emits
  real scip.proto messages, vendored/generated at Sources/scip-swift/Generated/Scip.pb.swift from
  Protos/scip.proto via Protos/generate.sh), apple/swift-argument-parser (CLI). Platform:
  macOS(.v14)+ only — indexing Apple-platform-only frameworks (UIKit/WatchKit/WidgetKit) requires a
  macOS host with Xcode/SDKs, since Apple doesn't ship the iOS SDK for Linux.

  Source layout (Sources/scip-swift/): Build/ (build-tool detection + swift build/xcodebuild
  runners), IndexStore/ (IndexStoreDB loading + Swift file discovery), SCIPMapping/ (IndexStoreDB →
  scip.proto mapping: symbol formatting, kind/role mapping, position mapping), Platform/
  (toolchain info), Generated/ (vendored protobuf bindings — do not hand-edit, regenerate via
  Protos/generate.sh), ScipSwiftCommand.swift (CLI entry point).

  Known design decisions (see openspec/changes/build-scip-swift-converter/design.md):
  - Symbol.scip_symbol embeds the compiler's raw USR as an opaque identifier — not a demangled
    namespace/type/method chain. USRs are unique/stable per-project but not human-readable.
  - Occurrence ranges are approximate: IndexStoreDB records only a single anchor point, so end
    column is derived from the symbol's display-name length.
  - SCIP's real SymbolRole enum has no call-specific bit (Definition | Import | WriteAccess |
    ReadAccess | Generated | Test | ForwardDefinition) — IndexStoreDB's `.call` role rides along on
    whatever `.reference`/`.write` role already applies; no dedicated mapping needed.
  - Swift toolchain version is pinned (.swift-version) because USR format is compiler-version
    sensitive; don't assume USR stability across toolchain upgrades.
  - Distributed as a prebuilt macOS binary via GitHub Releases (v0.1.0 tagged, arm64) — consumers
    shouldn't need the Swift toolchain just to invoke this CLI on PATH.

  Testing: `swift test` (Tests/scip-swiftTests/) — unit tests for symbol formatting and
  kind/role mapping, plus an integration test running the full pipeline against
  Fixtures/MiniSwiftPackage. CI runs on GitHub Actions macOS runners (.github/workflows/ci.yml).

